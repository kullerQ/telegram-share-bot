[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["UP042", "BLE001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
packages = ["sendmedia_bot"]

[[tool.mypy.overrides]]
module = ["yt_dlp.*"]
ignore_errors = true
