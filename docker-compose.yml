services:
  bot:
    image: ghcr.io/kullerq/telegram-share-bot:${BOT_IMAGE_TAG:-latest}
    pull_policy: missing
    container_name: telegram-share-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
      - ./logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Prefer host firewall / reverse-proxy egress allowlists in production:
    # allow outbound HTTPS to api.telegram.org and media CDNs only.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('https://api.telegram.org', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
