name: Cleanup GHCR

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  schedule:
    # Weekly safety net if a push cleanup is skipped
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  cleanup:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      # Buildx provenance/SBOM creates extra untagged versions per push.
      # Remove those first so min-versions-to-keep counts real releases.
      - name: Delete untagged package versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 0

      - name: Keep only the 3 newest tagged versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 3
